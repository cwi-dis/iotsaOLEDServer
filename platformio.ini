; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs =
    nodemcuv2
    lolin32-oled
; Board definitions vendored from cwi-dis/iotsa -- see cwi-dis/iotsa#224 and the
; header of iotsa-board-defs.ini. Refresh both files whenever the iotsa dependency
; is bumped; do not hand-edit. App-specific choices stay in the [env:*] sections.
extra_configs =
    iotsa-board-traits.ini
    iotsa-board-defs.ini

[common]
framework = arduino
lib_ldf_mode = deep+
lib_compat_mode = strict
lib_deps =
    https://github.com/cwi-dis/iotsa.git#develop
    Adafruit GFX Library
    Adafruit SSD1306
build_flags =
monitor_speed = 115200

; ESP8266 build-coverage target (an SSD1306 works fine on an ESP8266). 4m1m:
; 1MB filesystem + OTA scratch space (this app has IotsaOtaMod). No HTTPS here --
; IOTSA_WITH_HTTPS on ESP8266 is unreliable (cwi-dis/iotsa#159).
[env:nodemcuv2]
extends = iotsa_v4
board_build.ldscript = eagle.flash.4m1m.ld

; The real target: a Wemos LOLIN32 with an onboard SSD1306 OLED. The board-def
; already sets board = lolin32_lite + min_spiffs.csv. HTTPS ("for securing your
; display") is fine on the ESP32.
[env:lolin32-oled]
extends = lolin32_oled
build_flags = -DIOTSA_WITH_HTTPS
